name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Build ${{ matrix.format }} (OpenWrt SDK ${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - format: ipk
            arch: x86_64-24.10.0
          - format: apk
            arch: x86_64-25.12.6
    steps:
      - uses: actions/checkout@v4

      - name: Build with OpenWrt SDK
        uses: openwrt/gh-action-sdk@main
        env:
          ARCH: ${{ matrix.arch }}
          FEEDNAME: ddns_scripts_onamae
          PACKAGES: ddns-scripts-onamae

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: ddns-scripts-onamae-${{ matrix.format }}
          path: bin/packages/**/ddns-scripts-onamae*.${{ matrix.format }}
          if-no-files-found: error
